<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS V0</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23050a12' stroke='%2364d2ff' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%2364d2ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="dot" id="statusDot"></span>
    <h1>JARVIS <small>v0</small></h1>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main>
  <section class="stage">
    <button id="micBtn" class="mic" aria-label="Parla con JARVIS">
      <span class="ring"></span>
      <span class="core"></span>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
        <path d="M19 11a7 7 0 0 1-14 0M12 18v3"/>
      </svg>
    </button>
    <p class="hint" id="hint">Tieni premuto <kbd>Spazio</kbd> o clicca per parlare</p>
    <p class="state" id="state">Inizializzazione…</p>
  </section>

  <section class="log" id="log" aria-live="polite"></section>
</main>

<footer class="bottom">
  <button id="clearBtn" class="ghost">Pulisci memoria</button>
  <button id="textBtn" class="ghost">Scrivi</button>
  <span class="privacy">Audio mai salvato su disco</span>
</footer>

<form id="textForm" class="textbar" hidden>
  <input id="textInput" type="text" placeholder="Scrivi a JARVIS…" autocomplete="off">
  <button type="submit">Invia</button>
</form>

<script src="/app.js"></script>
</body>
</html>
