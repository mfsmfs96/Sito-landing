<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pulse — Mercati &amp; Notizie in tempo reale</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">Pulse<span>.</span></div>
  <div class="status">
    <i id="statusDot" class="dot"></i>
    <span id="statusText">Connessione…</span>
    <span class="sep">·</span>
    <span id="clock">--:--:--</span>
  </div>
</header>

<main class="layout">

  <section class="panel prices">
    <h1>Mercato crypto <small>live</small></h1>
    <div id="priceGrid" class="price-grid"></div>
  </section>

  <section class="panel news">
    <h2>Notizie <small id="newsUpdated">in aggiornamento…</small></h2>
    <ul id="newsList" class="news-list"></ul>
  </section>

</main>

<footer class="foot">
  Prezzi via Coinbase WebSocket (fallback CoinGecko) · Notizie da CoinDesk e Cointelegraph · Aggiornamento automatico
</footer>

<script src="app.js"></script>
</body>
</html>
